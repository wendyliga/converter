<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Not found — Converter</title>
    <script>
      // Resolve theme before first paint, matching the main app.
      ;(function () {
        try {
          var stored = localStorage.getItem('converter-theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.dataset.theme = theme
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #111827;
        --muted: #6b7280;
        --link: #4f46e5;
      }
      :root[data-theme='dark'] {
        --bg: #0b0f19;
        --fg: #f3f4f6;
        --muted: #9ca3af;
        --link: #a5b4fc;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--fg);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        text-align: center;
        padding: 1.5rem;
      }
      main {
        max-width: 28rem;
      }
      h1 {
        font-size: 3rem;
        margin: 0 0 0.5rem;
      }
      p {
        color: var(--muted);
        margin: 0 0 1.5rem;
        line-height: 1.5;
      }
      a {
        color: var(--link);
        font-weight: 600;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <p>This page could not be found.</p>
      <a href="/">Back to the converter</a>
    </main>
  </body>
</html>
