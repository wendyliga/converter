<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Converter social preview</title>
  <desc id="desc">Preview card for Converter, a private browser-based image converter.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f8fb"/>
      <stop offset="0.55" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <filter id="shadow" width="140%" height="140%" x="-20%" y="-20%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#1e293b" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="74" y="62" width="1052" height="506" rx="34" fill="#fff" filter="url(#shadow)"/>
  <rect x="74" y="62" width="1052" height="506" rx="34" fill="none" stroke="#dbe4f0" stroke-width="2"/>

  <g transform="translate(126 112)">
    <rect width="82" height="82" rx="20" fill="url(#accent)"/>
    <path d="M20 31h38m-12-12 12 12-12 12" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M62 51H24m12-12-12 12 12 12" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity=".86"/>
  </g>

  <text x="228" y="166" fill="#172033" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="38" font-weight="800">Converter</text>
  <text x="126" y="278" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="56" font-weight="850">
    Private image converter
  </text>
  <text x="128" y="354" fill="#475569" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="33" font-weight="600">
    Convert PNG, JPG, WebP, HEIC, TIFF, SVG and more
  </text>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="750">
    <rect x="126" y="424" width="169" height="54" rx="16" fill="#eef2ff"/>
    <text x="150" y="459" fill="#4338ca">No upload</text>
    <rect x="316" y="424" width="185" height="54" rx="16" fill="#ecfeff"/>
    <text x="340" y="459" fill="#0e7490">No account</text>
    <rect x="522" y="424" width="257" height="54" rx="16" fill="#f0fdf4"/>
    <text x="546" y="459" fill="#15803d">Batch + resize</text>
  </g>

  <g transform="translate(835 152)">
    <rect x="0" y="0" width="220" height="150" rx="24" fill="#f8fafc" stroke="#dbe4f0" stroke-width="2"/>
    <rect x="26" y="30" width="92" height="23" rx="12" fill="#4f46e5"/>
    <rect x="26" y="72" width="154" height="17" rx="9" fill="#cbd5e1"/>
    <rect x="26" y="106" width="122" height="17" rx="9" fill="#cbd5e1"/>
    <path d="M97 205h72l-24-25 15-15 50 50-50 50-15-15 24-25H97v-20Z" fill="#0891b2"/>
    <rect x="48" y="288" width="220" height="150" rx="24" fill="#f8fafc" stroke="#dbe4f0" stroke-width="2"/>
    <rect x="74" y="318" width="92" height="23" rx="12" fill="#0891b2"/>
    <rect x="74" y="360" width="154" height="17" rx="9" fill="#cbd5e1"/>
    <rect x="74" y="394" width="122" height="17" rx="9" fill="#cbd5e1"/>
  </g>
</svg>
